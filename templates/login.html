{% extends "base.html" %}

{% block auth_content %}
<div class="max-w-sm w-full bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
    <div class="px-8 pt-10 pb-6 text-center">
        <img src="{{ url_for('static', filename='doxera_logo.png') }}" alt="DOXERA" class="h-10 mx-auto mb-6">
        <h2 class="text-xl font-semibold text-slate-800">Welcome Back</h2>
        <p class="text-sm text-slate-500 mt-1">Sign in to DOXERA Operations</p>
    </div>
    
    <div class="px-8 pb-8">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-4">
                {% for category, message in messages %}
                    <div class="text-xs font-medium px-3 py-2 rounded text-rose-700 bg-rose-50 border border-rose-200">
                        {{ message }}
                    </div>
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-5">
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1">Username</label>
                <input type="text" id="username" name="username" required 
                       class="block w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-nexpress-blue focus:border-nexpress-blue text-sm transition-colors outline-none" 
                       placeholder="Enter username">
            </div>
            
            <div>
                <label for="password" class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1">Password</label>
                <input type="password" id="password" name="password" required 
                       class="block w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-nexpress-blue focus:border-nexpress-blue text-sm transition-colors outline-none"
                       placeholder="Enter password">
            </div>
            
            <button type="submit" class="w-full flex justify-center items-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-nexpress-blue hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-nexpress-blue transition-colors mt-2">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
